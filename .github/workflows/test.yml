name: 'Run tests'

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  formatting:
    name: 'Check Formatting using Black'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: 'Set up uv'
      uses: astral-sh/setup-uv@v7
    - name: 'Install Formatting checkers'
      run: |
        uv sync --locked --extra dev
    - name: 'Check Formatting using Black'
      run: |
        uv run --locked --extra dev black --check .

  tests:
    name: 'Run tests and publish'
    runs-on: ubuntu-latest
    env:
      DISPLAY: ':99.0'
    steps:
    - uses: actions/checkout@v2
    - run: ./tools/setup_xvfb.sh
      name: 'Setup xvfb'   
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
    - name: 'Install dependencies'
      run: |
        uv sync --locked --extra dev
    - name: 'Run Pytest with xvfb'
      run: |
        uv run --locked --extra dev pytest --cov=bfieldtools ./tests
        # Push coverage to codecov.io
        bash <(curl -s https://codecov.io/bash)
